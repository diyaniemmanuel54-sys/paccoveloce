    <rect x="84" y="162" width="56" height="56" rx="5" fill="#c98a4b"/>
    <rect x="148" y="176" width="60" height="42" rx="5" fill="#d9975e"/>
    <rect x="216" y="164" width="52" height="54" rx="5" fill="#e0a76b"/>
